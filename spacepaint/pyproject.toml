[project]
name = "spacepaint"
version = "0.1.0"
description = "A radiant 3D turtle-graphics environment for introductory Python"
license = "MIT"
authors = [
    { name = "Kris Jordan", email = "kris@cs.unc.edu" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "panda3d==1.10.13",
    "ursina<8",
]

[project.scripts]
spacepaint = "spacepaint:main"
spacepaint-submit = "spacepaint.submission:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "flight_plans"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.ruff.lint]
ignore = ["PLR1711", "RET501"]