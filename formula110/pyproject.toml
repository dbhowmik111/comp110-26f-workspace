[project]
name = "racing"
version = "0.1.0"
description = "Self-driving race cars in COMP110"
requires-python = ">=3.11,<3.12"
dependencies = [
    "panda3d==1.10.13",
    "ursina<8",
]

[project.scripts]
racing = "racing:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["racing", "controllers"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.20",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["SIM108"]
